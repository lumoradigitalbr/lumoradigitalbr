<body>

    <iframe id="tally-iframe" src="about:blank"></iframe>
    
    <script>
        function getCookie(name) {
            const value = "; " + document.cookie;
            const parts = value.split("; " + name + "=");
            if (parts.length === 2) return parts.pop().split(";").shift();
            return "";
        }

        // Retry generico: espera cookie aparecer (Pixel demora ~100-500ms pra setar).
        async function waitCookie(name, maxTries, intervalMs) {
            for (let i = 0; i < maxTries; i++) {
                const v = getCookie(name);
                if (v) return v;
                await new Promise(r => setTimeout(r, intervalMs));
            }
            return "";
        }

        async function carregarTally() {
            const urlParams = new URLSearchParams(window.location.search);
            const valor = urlParams.get('valor') || '';
            // --- TIKTOK: evento de COMPRA (esta landing e pos-pagamento) ---
            try { if (window.ttq) { ttq.track('CompletePayment', { value: parseFloat(String(valor).replace(',', '.')) || 0, currency: 'BRL', content_type: 'product' }); } } catch (e) {}

            const fbclidUrl = urlParams.get('fbclid') || '';
            const ttclidUrl = urlParams.get('ttclid') || '';

            // --- FBP: cookie setado pelo Pixel Meta pra QUALQUER visitante.
            // Retry ate 6s pra cobrir navegador lento / Pixel carregando async.
            let fbp = await waitCookie('_fbp', 12, 500);

            // --- FBC: so existe se veio de anuncio Meta (fbclid) ou navegou no Facebook.
            // 1) Cookie _fbc setado pelo proprio Pixel (prioridade maxima).
            let fbc = await waitCookie('_fbc', 4, 250);
            // 2) Sem cookie, mas com fbclid na URL -> reconstroi formato oficial fb.1.timestamp.fbclid
            if (!fbc && fbclidUrl) {
                fbc = fb.1.${Date.now()}.${fbclidUrl};
            }
            // 3) Sem cookie e sem fbclid -> NAO inventar. Enviar fbc invalido degrada o EMQ.

            // --- TIKTOK: ttclid + _ttp cookie ---
            let ttclid = getCookie('_ttclid') || ttclidUrl;
            let ttp = await waitCookie('_ttp', 12, 500);

            const ua = navigator.userAgent.substring(0, 150);
            let ip = '';
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                const res = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
                const data = await res.json();
                ip = data.ip;
                clearTimeout(timeoutId);
            } catch (e) {
                ip = "";
            }

            const tallyID = "9q6jMK"; // TALLY ID MANTIDO

            // Monta URL do Tally so com params que tem valor real (evita mandar '' pro webhook).
            const params = new URLSearchParams();
            if (valor)  params.set('valor', valor);
            if (fbc)    params.set('fbc', fbc);
            if (fbp)    params.set('fbp', fbp);
            if (ttclid) params.set('ttclid', ttclid);
            if (ttp)    params.set('ttp', ttp);
            if (ip)     params.set('ip', ip);
            if (ua)     params.set('ua', ua);

            const finalURL = https://tally.so/r/${tallyID}?${params.toString()};

            const iframe = document.getElementById('tally-iframe');
            if (iframe) {
                iframe.src = finalURL;
            }
        }

        if (document.readyState === 'complete') {
            carregarTally();
        } else {
            window.addEventListener('load', carregarTally);
        }
    </script>
</body>
